<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu: #142B57;
    --bleu-mid: #2B4E8C;
    --rouge: #C8112E;
    --blanc: #FFFFFF;
    --fond: #F6F6F3;
    --carte: #FFFFFF;
    --ink: #1C2230;
    --ink-soft: #5B6270;
    --ligne: #E3E4E0;

    --live-fg: #166A45;
    --live-bg: #E4F3EA;
    --draft-fg: #5B6270;
    --draft-bg: #ECECE9;
    --review-fg: #9A6B15;
    --review-bg: #FBF0DA;
    --blocked-fg: #A80F27;
    --blocked-bg: #FAE4E7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--rouge);
    border-bottom: 1px solid var(--ligne);
  }

  .flag-stripe {
    height: 5px;
    width: 100%;
    background: linear-gradient(to right, var(--bleu) 0 33.33%, var(--blanc) 33.33% 66.66%, var(--rouge) 66.66% 100%);
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }

  .park-illustration {
    flex-shrink: 0;
    width: 150px;
    height: 84px;
  }

  @media (max-width: 560px) {
    .park-illustration { display: none; }
  }

  .brand-mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.85rem;
    color: var(--blanc);
    letter-spacing: -0.01em;
  }

  .brand-sub {
    margin-top: 4px;
    color: var(--blanc);
    font-size: 0.95rem;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 34px 28px 60px;
  }

  /* Summary bar */
  .summary-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 26px;
  }

  .stat-card {
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1 1 110px;
  }

  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 1.7rem;
    font-weight: 500;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 5px;
  }

  .progress-card {
    flex: 2 1 260px;
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-radius: 10px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .progress-top .stat-label { margin-top: 0; }

  .progress-pct {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--bleu);
  }

  .progress-track {
    height: 9px;
    border-radius: 100px;
    background: var(--draft-bg);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(to right, var(--bleu), var(--rouge));
    transition: width 0.4s ease;
  }

  /* Controls */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
  }

  .controls-bar input[type="text"],
  .controls-bar select {
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    padding: 10px 14px;
    border: 1px solid var(--ligne);
    border-radius: 8px;
    background: var(--carte);
    color: var(--ink);
  }

  .controls-bar input[type="text"]:focus,
  .controls-bar select:focus {
    outline: 2px solid var(--bleu-mid);
    outline-offset: 1px;
  }

  .search-input {
    flex: 1 1 220px;
  }

  .controls-bar select {
    flex: 0 1 170px;
  }

  .result-count {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    padding: 50px 20px;
    border: 1px dashed var(--ligne);
    border-radius: 10px;
    font-size: 0.92rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-left: 4px solid var(--card-accent, var(--ligne));
    border-radius: 10px;
    padding: 20px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .page-name {
    font-family: 'Fraunces', serif;
    font-size: 1.12rem;
    font-weight: 500;
    color: var(--bleu);
    line-height: 1.25;
  }

  .section-tag {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 5px;
  }

  .status-pill {
    flex-shrink: 0;
    font-size: 0.74rem;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .status-live   { color: var(--live-fg);    background: var(--live-bg); }
  .status-draft  { color: var(--draft-fg);   background: var(--draft-bg); }
  .status-review { color: var(--review-fg);  background: var(--review-bg); }
  .status-blocked{ color: var(--blocked-fg); background: var(--blocked-bg); }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--ligne);
    padding-top: 13px;
  }

  .owner {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bleu-mid);
    color: var(--blanc);
    font-size: 0.68rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .owner-name {
    font-size: 0.85rem;
    color: var(--ink);
  }

  .updated {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: right;
  }

  @media (max-width: 480px) {
    .header-inner { padding: 24px 18px 20px; }
    main { padding: 24px 18px 40px; }
    .stat-card, .progress-card { flex: 1 1 100%; }
    .controls-bar select { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="flag-stripe"></div>
  <div class="header-inner">
    <div>
      <div class="brand-mark">Parc Claude</div>
      <div class="brand-sub">Tracy's content status across the park's website</div>
    </div>
    <svg class="park-illustration" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the park skyline: a Ferris wheel, carousel tent and castle turret">
      <line x1="0" y1="108" x2="220" y2="108" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>

      <!-- Ferris wheel -->
      <g stroke="#FFFFFF" stroke-opacity="0.85" fill="none" stroke-width="2">
        <line x1="26" y1="108" x2="46" y2="44" />
        <line x1="66" y1="108" x2="46" y2="44" />
        <circle cx="46" cy="44" r="30" />
        <g stroke-opacity="0.6">
          <line x1="46" y1="14" x2="46" y2="74" />
          <line x1="16" y1="44" x2="76" y2="44" />
          <line x1="25" y1="23" x2="67" y2="65" />
          <line x1="67" y1="23" x2="25" y2="65" />
        </g>
      </g>
      <circle cx="46" cy="44" r="4" fill="#FFFFFF" />

      <!-- Carousel tent -->
      <g>
        <polygon points="110,38 132,38 121,20" fill="#FFFFFF" fill-opacity="0.9" />
        <line x1="121" y1="20" x2="121" y2="12" stroke="#FFFFFF" stroke-width="2" />
        <polygon points="121,8 129,12 121,16" fill="#FFFFFF" />
        <line x1="112" y1="38" x2="112" y2="70" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" />
        <line x1="130" y1="38" x2="130" y2="70" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" />
        <line x1="121" y1="38" x2="121" y2="70" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />
        <path d="M108 70 Q121 82 134 70" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" fill="none" />
      </g>

      <!-- Castle turret -->
      <g fill="#FFFFFF">
        <rect x="168" y="46" width="30" height="62" fill-opacity="0.9" />
        <polygon points="163,46 203,46 183,24" fill-opacity="0.95" />
        <rect x="177" y="72" width="12" height="36" fill="#C8112E" />
        <line x1="183" y1="24" x2="183" y2="12" stroke="#FFFFFF" stroke-width="2" />
        <polygon points="183,8 193,12 183,16" />
      </g>
    </svg>
  </div>
</header>

<main>
  <div class="summary-bar" id="summaryBar"></div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Search by page name…">
    <select id="sectionFilter"></select>
    <select id="statusFilter"></select>
    <select id="sortOrder">
      <option value="newest">Last updated: newest first</option>
      <option value="oldest">Last updated: oldest first</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
  const pages = [
    { name: "Le Grand Huit",         section: "Attractions",  status: "Live",          owner: "Camille Dubois",  updated: "2026-09-12" },
    { name: "Château Vertige",       section: "Attractions",  status: "Needs review",  owner: "Émile Laurent",   updated: "2026-09-20" },
    { name: "Carrousel Royal",       section: "Attractions",  status: "Live",          owner: "Camille Dubois",  updated: "2026-08-30" },
    { name: "Rivière Sauvage",       section: "Attractions",  status: "Blocked",       owner: "Émile Laurent",   updated: "2026-07-15" },
    { name: "Billets Journée",       section: "Tickets",      status: "Live",          owner: "Sophie Marchand", updated: "2026-09-25" },
    { name: "Pass Saison",           section: "Tickets",      status: "Draft",         owner: "Sophie Marchand", updated: "2026-09-18" },
    { name: "Offres Groupe",         section: "Tickets",      status: "Needs review",  owner: "Nadia Rousseau",  updated: "2026-09-10" },
    { name: "Plan du Parc",          section: "Visit Us",     status: "Live",          owner: "Julien Fontaine", updated: "2026-09-22" },
    { name: "Horaires & Accès",      section: "Visit Us",     status: "Live",          owner: "Julien Fontaine", updated: "2026-09-28" },
    { name: "Hôtels Partenaires",    section: "Visit Us",     status: "Draft",         owner: "Nadia Rousseau",  updated: "2026-09-05" },
    { name: "Bistro Le Tricolore",   section: "Food & Drink", status: "Live",          owner: "Marc Petit",      updated: "2026-09-14" },
    { name: "Crêperie des Lumières", section: "Food & Drink", status: "Blocked",       owner: "Marc Petit",      updated: "2026-08-02" },
  ];

  const statusMeta = {
    "Live":          { cls: "status-live",    accent: "#166A45" },
    "Draft":         { cls: "status-draft",   accent: "#9BA0A8" },
    "Needs review":  { cls: "status-review",  accent: "#C8951B" },
    "Blocked":       { cls: "status-blocked", accent: "#C8112E" },
  };

  function initials(name) {
    return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  }

  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  const sections = [...new Set(pages.map(p => p.section))];
  const statuses = Object.keys(statusMeta);

  // ---- Summary bar (always reflects all pages, not the filtered view) ----
  function renderSummary() {
    const counts = pages.reduce((acc, p) => {
      acc[p.status] = (acc[p.status] || 0) + 1;
      return acc;
    }, {});
    const total = pages.length;
    const live = counts["Live"] || 0;
    const launchReadyPct = Math.round((live / total) * 100);

    const summaryBar = document.getElementById("summaryBar");
    summaryBar.innerHTML = `
      <div class="stat-card">
        <div class="stat-num">${total}</div>
        <div class="stat-label">Total pages</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${statusMeta['Live'].accent}">${live}</div>
        <div class="stat-label">Live</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${statusMeta['Draft'].accent}">${counts['Draft'] || 0}</div>
        <div class="stat-label">Draft</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${statusMeta['Needs review'].accent}">${counts['Needs review'] || 0}</div>
        <div class="stat-label">Needs review</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:${statusMeta['Blocked'].accent}">${counts['Blocked'] || 0}</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="progress-card">
        <div class="progress-top">
          <span class="stat-label">Launch ready (live)</span>
          <span class="progress-pct">${launchReadyPct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${launchReadyPct}%"></div>
        </div>
      </div>
    `;
  }

  // ---- Filter controls ----
  const searchInput = document.getElementById("searchInput");
  const sectionFilter = document.getElementById("sectionFilter");
  const statusFilter = document.getElementById("statusFilter");
  const sortOrder = document.getElementById("sortOrder");

  sectionFilter.innerHTML = `<option value="all">All sections</option>` +
    sections.map(s => `<option value="${s}">${s}</option>`).join("");

  statusFilter.innerHTML = `<option value="all">All statuses</option>` +
    statuses.map(s => `<option value="${s}">${s}</option>`).join("");

  function cardHTML(p) {
    const meta = statusMeta[p.status];
    return `
      <div class="card" style="--card-accent:${meta.accent}">
        <div class="card-top">
          <div>
            <div class="page-name">${p.name}</div>
            <div class="section-tag">${p.section}</div>
          </div>
          <span class="status-pill ${meta.cls}">${p.status}</span>
        </div>
        <div class="card-foot">
          <div class="owner">
            <div class="avatar">${initials(p.owner)}</div>
            <div class="owner-name">${p.owner}</div>
          </div>
          <div class="updated">${formatDate(p.updated)}</div>
        </div>
      </div>
    `;
  }

  function renderGrid() {
    const term = searchInput.value.trim().toLowerCase();
    const section = sectionFilter.value;
    const status = statusFilter.value;

    let filtered = pages.filter(p => {
      const matchesTerm = !term || p.name.toLowerCase().includes(term);
      const matchesSection = section === "all" || p.section === section;
      const matchesStatus = status === "all" || p.status === status;
      return matchesTerm && matchesSection && matchesStatus;
    });

    filtered.sort((a, b) => {
      const diff = new Date(a.updated) - new Date(b.updated);
      return sortOrder.value === "newest" ? -diff : diff;
    });

    const grid = document.getElementById("grid");
    const resultCount = document.getElementById("resultCount");

    resultCount.textContent = `Showing ${filtered.length} of ${pages.length} pages`;

    grid.innerHTML = filtered.length
      ? filtered.map(cardHTML).join("")
      : `<div class="empty-state">No pages match your search and filters.</div>`;
  }

  [searchInput, sectionFilter, statusFilter, sortOrder].forEach(el => {
    el.addEventListener("input", renderGrid);
    el.addEventListener("change", renderGrid);
  });

  renderSummary();
  renderGrid();
</script>

</body>
</html>
